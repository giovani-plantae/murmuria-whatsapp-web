<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>murmuria — microphone access</title>
    <style>
      :root {
        --ground: #0b1020;
        --panel: #141c33;
        --text: #e6eaf5;
        --muted: #8b97b8;
        --line: rgba(148, 163, 184, 0.14);
        --teal: #14b8a6;
        --grad: linear-gradient(135deg, #6366f1 0%, #4f46e5 50%, #14b8a6 100%);
        --ok: #22c55e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background:
          radial-gradient(600px 320px at 15% -10%, rgba(99, 102, 241, 0.2), transparent 60%),
          radial-gradient(600px 360px at 110% 0%, rgba(20, 184, 166, 0.14), transparent 55%),
          var(--ground);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        line-height: 1.5;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      .card {
        max-width: 460px;
        padding: 32px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      .allow {
        padding: 11px 18px;
        border: none;
        border-radius: 10px;
        background: var(--grad);
        color: #fff;
        font: 600 14px/1 inherit;
        cursor: pointer;
      }
      .allow:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .status {
        margin: 18px 0 0;
        min-height: 20px;
        font-size: 14px;
      }
      .status[data-state='ok'] {
        color: var(--ok);
      }
      .status[data-state='bad'] {
        color: #fda4af;
      }
      .diag {
        margin: 10px 0 0;
        min-height: 16px;
        color: var(--muted);
        font:
          500 12px/1.5 ui-monospace,
          'SF Mono',
          Menlo,
          monospace;
      }
      :focus-visible {
        outline: 2px solid var(--teal);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Enable the microphone</h1>
      <p>
        murmuria needs microphone access to record audio for transcription. Chrome can only ask for
        it on a full page like this one — not from the toolbar popup. Allow it once here, then
        recording will work straight from the popup.
      </p>
      <button class="allow" id="allow" type="button">Allow microphone</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="diag" id="diag"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
